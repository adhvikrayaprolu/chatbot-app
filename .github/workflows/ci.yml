name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo build --locked --manifest-path retrieval/Cargo.toml
      - run: cargo test --locked --manifest-path retrieval/Cargo.toml
      - run: python -m pytest -q
      - run: make check
      - run: python -m compileall -q app.py gpt_handler.py storage.py knowledge.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: cargo build --locked --manifest-path retrieval/Cargo.toml
      - run: RUN_BROWSER=1 python -m pytest -q tests/test_browser.py
  docker:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: chatbot-ci
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose and start healthy service
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 90
      - name: Verify container isolation and restart persistence
        run: |
          python scripts/runtime_smoke.py --restart-container "$(docker compose ps -q chatbot)"
          docker compose up --wait --wait-timeout 90
      - name: Stop disposable Compose project
        if: always()
        run: docker compose down --volumes
