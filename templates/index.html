<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ChatBot</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #1f1f28;
      color: #f5f5f5;
      height: 100vh;
      overflow: hidden;
    }

    #container {
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    #sidebar {
      width: 250px;
      background-color: #2a2f38;
      padding: 20px;
      overflow-y: auto;
      border-right: 1px solid #444;
    }

    #sidebar h3 {
      font-size: 16px;
      margin-bottom: 10px;
      color: #f5f5f5;
    }

    #sidebar button {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      background-color: #3d4f5c;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    #sidebar button:hover {
      background-color: #4f6a7b;
    }

    #conversationList {
      list-style: none;
      padding-left: 0;
    }

    #conversationList li {
      padding: 10px;
      margin-bottom: 10px;
      background-color: #3a3f48;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s;
      color: #eee;
    }

    #conversationList li:hover {
      background-color: #4a4f5a;
    }

    #conversationList li.active {
      background-color: #5a5f6a;
      font-weight: 500;
    }

    /* Main Chat Area */
    #mainArea {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 20px;
        width: 100%;
        position: relative;
    }

    h2 {
      margin-bottom: 10px;
      text-align: center;
      font-size: 20px;
      color: #ffffff;
    }

    #chatContainer {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin-bottom: 10px;
        padding-right: 10px;
        scroll-behavior: smooth;
    }

    .message {
        margin-bottom: 12px;
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 15px;
        line-height: 1.5;
        max-width: 75%;
        word-wrap: break-word;
        background-color: #2e2e38;
        display: inline-block;
    }


    .user {
        align-self: flex-end;
        background-color: #3b3f4c;
        color: #f0f0f0;
    }

    .assistant {
        align-self: flex-start;
        background-color: #444b55;
        color: #ffffff;
    }

    #inputSection {
        display: flex;
        width: 100%;
        padding-top: 10px;
        background-color: #1f1f28;
        position: sticky;
        bottom: 0;
        z-index: 10;
        border-top: 1px solid #333;
    }

    #userInput {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      background-color: #2f3640;
      color: white;
    }

    #sendBtn {
      margin-left: 10px;
      padding: 14px 20px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background-color: #16a085;
      color: white;
      cursor: pointer;
    }

    #sendBtn:hover {
      background-color: #12876f;
    }

    /* Reset all block elements inside message */
    .message p,
    .message ul,
    .message ol,
    .message li,
    .message pre,
    .message code,
    .message blockquote {
        margin: 0;
        padding: 0;
        line-height: 1.5;
    }

    /* Adjust spacing between paragraphs and list groups */
    .message p + p,
    .message ul,
    .message ol {
        margin-top: 6px;
    }

    /* Proper indent for lists */
    .message ul,
    .message ol {
        padding-left: 20px;
    }

    /* Space between list items */
    .message li + li {
        margin-top: 4px;
    }


  </style>
</head>
<body>
  <div id="container">
    <!-- Sidebar -->
    <div id="sidebar">
      <h2>Conversations</h2>
      <br>

      <!-- Start a new chat – calls the newConversation() function for the same -->
      <button onclick="newConversation()">+ New Chat</button>
      <ul id="conversationList"></ul>
    </div>

    <!-- Chat Area -->
    <div id="mainArea">
        <h2>ChatBot</h2>
        <div id="chatContainer"></div>
        <div id="inputSection">

          <!-- Input box - calls the sendMessage() function when 'send' or enter key is clicked -->
            <input type="text" id="userInput" placeholder="Type your message..." />
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>
  </div>

  <script>
    // Initializing the state of each of the fields mentioned
    const chatContainer = document.getElementById("chatContainer");
    const inputField = document.getElementById("userInput");
    const sendButton = document.getElementById("sendBtn");
    const conversationList = document.getElementById("conversationList");

    // Array that holds all conversations with the chatbot
    let conversations = [];

    // Each conversation is stored as an object below:
    // {
    //   title: "New Chat",
    //   messages: [ { role: "user", content: "..." }, { role: "assistant", content: "..." } ]
    // }

    // Keeps track of which conversation is currently active to know when to 
    let currentConversationIndex = null;

    // Load conversations from localStorage 
    function loadFromLocalStorage() {
      
      // Pulls the saved conversation data from localStorage using the key provided
      const saved = localStorage.getItem("chatAppConversations");
      // localStorage only stores strings, so JSON.stringify() is used when saving data, and JSON.parse() is used when loading

      if (saved) {

        // Converts the saved string into a JavaScript array of conversation objects (240-244)
        conversations = JSON.parse(saved);

        // sets conversation to the first index (0)
        currentConversationIndex = 0;

        // calls a function – renderConversationList() updates the sidebar with the saved conversations
        renderConversationList();

        // calls a function – loadConversation() loads and displays all the messages of the first conversation in the chatbox area
        loadConversation();
      } else {

        // if no conversations are saved, a new conversation is started for the user
        newConversation();
      }
    }

    // Save to localStorage – saves all current conversations to the browser's local storage
    // function is called everytime a new message is sent, a new conversation is started, or the title of the conversation changes
    function saveToLocalStorage() {

      // JSON.stringify() converts the conversation object into string as localStorage can only store strings
      // .setItem() saves the respective strings under the key "chatAppConversations" in the browser's local storage
      localStorage.setItem("chatAppConversations", JSON.stringify(conversations));
    }

    // function is called everytime the '+ New Chat' buton is clicked
    function newConversation() {

      // for the new conversation, a new conversation object is created, with the default title 'New Chat'
      // Makes an empty array 'messages' to hold the chats in the conversation
      const newConv = { title: "New Chat", messages: [] };

      // the new conversation is added to the conversation array
      conversations.push(newConv);

      // updates the index of the to the point of the latest conversation added (.length - 1)
      currentConversationIndex = conversations.length - 1;

      // calls the function that rebuilds the sidebar with the new conversation 
      renderConversationList();

      // loads the new, 'empty' conversation into the chat area so the user can chat with the bot
      loadConversation();

      // saves the updated stated (a new conversation being added) to localStorage
      saveToLocalStorage();
    }

    // function refreshes the sidebar with the list of all the conversations
    function renderConversationList() {

      // clears the existing HTML inside the element (ul#conversationList - 214) to reset the sidebar 
      conversationList.innerHTML = "";

      // loops through the conversation array (conv - current conversation, index - position in the array)
      conversations.forEach((conv, index) => {

        // creates a new element that represents one chat
        const li = document.createElement("li");

        // sets the title of the conversation 
        li.textContent = conv.title;

        // on the selected chat – applies the active class for highlighting the selected conversation (78 - 81)
        li.classList.toggle("active", index === currentConversationIndex);

        // adds an on click listener on the respective conversation list item
        li.onclick = () => {
          // sets the index to the chat's index
          currentConversationIndex = index;

          // loads the messages sent on that chat window
          loadConversation();

          // calls the function again to update which item on the list is active
          renderConversationList();
        };

        // adds the newly created conversation (list item) to the front-end
        conversationList.appendChild(li);
      });
    }

    // displaying the messages in each conversation in the chat window
    function loadConversation() {

      // clears the entire chat history before reloading it with the respective conversation's messages
      chatContainer.innerHTML = "";

      // retreives the current conversation messages from the index 
      const conv = conversations[currentConversationIndex];

      // example of a chat you're on:
      // {
      //   title: "Prompt about climate...",
      //   messages: [
      //     { role: "user", content: "Tell me about climate change." },
      //     { role: "assistant", content: "Here's what I found..." }
      //   ]
      // }

      // loops through every message in the conversation's messages array and calls the appendMessage()
      // this then creates a message bubble for both the user and the assistant, and then adds it to the chat area in order
      conv.messages.forEach((msg) => appendMessage(msg.content, msg.role));
    }

    // user input is processed and a backend gets a GPT response
    // marked async because it will use await to wait for the response from the server
    async function sendMessage() {

      // gets the value from the input box from the user
      const userInput = inputField.value.trim();

      // cehcks if the input is empty after trimming whitespace 
      if (!userInput) return;

      // clears the input field, and disables typing and submitting a new message while waiting for GPT response
      inputField.value = "";
      inputField.disabled = true;
      sendButton.disabled = true;

      // adds the user's message onto the UI immediately to show the user
      appendMessage(userInput, "user");

      // adds the user's message to the currently active conversation's messages array with the role of user
      conversations[currentConversationIndex].messages.push({ role: "user", content: userInput });

      // saves updated conversation with new message to localStorage
      saveToLocalStorage();

      // while waiting for GPT response shows a temporary response to indicate that the chatbot is thinking
      const thinking = appendMessage("...", "assistant");

      try {

        // sends an HTTP POST request to the FLASK /chat route with the user's message as JSON
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: userInput }),
        });

        // waits for the server to send the response back, and then parses it as JSON
        // data.reply holds the GPT message 
        const data = await response.json();

        // replaces the '...' placeholder with the actual reply from the chatbot 
        // parsed through marked so it can render rich markdown (bullet points, bold, italics, etc.)
        thinking.innerHTML = marked.parse(data.reply);

        // stores the gpt reply in the conversation history in the messages array with the role of assistant
        conversations[currentConversationIndex].messages.push({ role: "assistant", content: data.reply });

        // renames the title of the conversation if the default name is still there (first 20 characters)
        // updates the conversation list UI 
        if (conversations[currentConversationIndex].title === "New Chat") {
          conversations[currentConversationIndex].title = userInput.slice(0, 20) + "...";
          renderConversationList();
        }

        // saves updated conversation with assistant reply to localStorage
        saveToLocalStorage();

        // if anything goes wrong (server is down, etc.), gpt response is replaced with error message
      } catch (err) {
        thinking.textContent = "Error fetching response.";
      }

      // re-enables the input fields and puts the cursor back into the box so the user can type the next message
      inputField.disabled = false;
      sendButton.disabled = false;
      inputField.focus();
    }

    // responsible for rendering the message (user or chatbot) into the chat area
    // has text – content of the message, and role - either "user" or "assistant" to style accordingly
    function appendMessage(text, role) {

      // creates a new 'div' element in memory – eventually becomes a chat bubble
      const message = document.createElement("div");

      // adds two CSS classes – message and based on the role (user or assistant) styles the message (111-134)
      message.classList.add("message", role);

      // parses text from markdown into HTML
      message.innerHTML = marked.parse(text);

      // adds the newly created div element to the chat container – shows up in UI
      chatContainer.appendChild(message);

      // scrolls it to the bottom so that the most recent message is visible first
      chatContainer.scrollTop = chatContainer.scrollHeight;

      // returns the message element 
      return message;
    }

    // allows the enter key to send messages
    inputField.addEventListener("keydown", function (e) {
      if (e.key === "Enter") sendMessage();
    });

    // loads previous conversations when the page is opened or refreshed
    loadFromLocalStorage();
  </script>
</body>
</html>
