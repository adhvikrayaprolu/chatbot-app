# Optional local developer observability. Generate ignored credentials first.
x-common: &common
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?generate instance/langfuse.env}@postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT:?}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?}
  TELEMETRY_ENABLED: 'false'
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_USER: default
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
  CLICKHOUSE_CLUSTER_ENABLED: 'false'
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  REDIS_AUTH: ${REDIS_PASSWORD:?}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://s3:9090
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
services:
  web:
    image: langfuse/langfuse:3.225.11@sha256:a343f64e035eb01aeea358703a0428945d909d01e19452509a5a830862dda878
    ports: ['127.0.0.1:3000:3000']
    depends_on: [postgres, redis, clickhouse, s3]
    environment:
      <<: *common
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?}
      LANGFUSE_INIT_ORG_ID: local-study
      LANGFUSE_INIT_ORG_NAME: Local Study
      LANGFUSE_INIT_PROJECT_ID: local-study
      LANGFUSE_INIT_PROJECT_NAME: Document Intelligence
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?}
      LANGFUSE_INIT_USER_EMAIL: study@localhost.test
      LANGFUSE_INIT_USER_NAME: Local Developer
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_USER_PASSWORD:?}
  worker:
    image: langfuse/langfuse-worker:3.225.11@sha256:8a28c946bb5401eef488153fa294db5a79bd99dd5c90db8e4d39559374c9ebd3
    depends_on: [postgres, redis, clickhouse, s3]
    environment: *common
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?}', POSTGRES_DB: langfuse}
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?}']
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment: {CLICKHOUSE_PASSWORD: '${CLICKHOUSE_PASSWORD:?}', CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'}
    volumes: [clickhouse-data:/var/lib/clickhouse]
  s3:
    image: adobe/s3mock@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: langfuse
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
    volumes: [s3-data:/s3mockroot]
volumes:
  postgres-data:
  clickhouse-data:
  s3-data:
